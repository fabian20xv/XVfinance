name: E0 Guardrails

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Assert Supabase project lock
        run: npm run assert:supabase
        env:
          SUPABASE_URL: https://krcwpupbdizzjyydzaqp.supabase.co
      - name: Lint (service-role isolation)
        run: npm run lint
      - name: Tests
        run: npm test
