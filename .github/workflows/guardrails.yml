name: E0 Guardrails

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Assert Supabase project lock
        run: npm run assert:supabase
        env:
          SUPABASE_URL: https://krcwpupbdizzjyydzaqp.supabase.co
      - name: Lint (service-role isolation)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Next.js web build
        run: npm run web:build
        env:
          SUPABASE_URL: https://krcwpupbdizzjyydzaqp.supabase.co
          NEXT_PUBLIC_SUPABASE_URL: https://krcwpupbdizzjyydzaqp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
      - name: Do not ship root middleware (Vercel Node ESM crash)
        run: |
          if [ -e middleware.ts ] || [ -e middleware.js ] || [ -e src/middleware.ts ] || [ -e src/middleware.js ]; then
            echo 'Root middleware is deployed as /var/task/middleware.js and fails: Cannot find module next/server'
            exit 1
          fi
          if [ -e .next/server/middleware.js ]; then
            echo 'Next.js still emitted an Edge middleware bundle; remove middleware.ts so / is not gated'
            exit 1
          fi
      - name: Next.js build includes App Router /
        run: test -e .next/server/app/page.js
